<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="description" content="IKEA or Death - guess whether a name belongs to an IKEA furniture product or a black-metal band.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>IKEA or Death</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%230f0f0f'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' font-family='sans-serif'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=1694011601">
</head>
<body>
  <div class="bg-glow"></div>
  <main class="game">
    <div class="header">
      <h1>IKEA <span class="vs">or</span> Death</h1>
      <p class="subtitle">Is it an IKEA product or a black-metal band?</p>
    </div>

    <div id="start-screen" class="screen active">
      <div class="start-content">
        <p class="start-description">You'll get a name. Guess whether it belongs to IKEA furniture or a black-metal band.</p>
        <p class="difficulty-hint">100+ items • Test your knowledge</p>
        <button id="start-btn" class="btn btn-primary">START</button>
      </div>
    </div>

    <div id="play-screen" class="screen">
      <div class="progress-container">
        <div class="score-info">
          <span id="streak-counter" class="streak">SCORE</span>
          <div class="progress-bar">
            <div id="score-bar" class="score-fill"></div>
          </div>
        </div>
        <span id="question-counter" class="question-counter">1/10</span>
      </div>

      <div class="play-content">
        <div id="name-display" class="name-display"></div>
        <div id="feedback" class="feedback"></div>
        <div class="divider"></div>
        <div class="choices">
          <button id="ikea-btn" class="btn btn-choice btn-ikea">
            <span class="choice-text">IKEA</span>
          </button>
          <button id="death-btn" class="btn btn-choice btn-death">
            <span class="choice-text">DEATH</span>
          </button>
        </div>
      </div>
    </div>

    <div id="end-screen" class="screen">
      <div class="end-content">
        <h2>Game Over</h2>
        <p id="final-score" class="final-score">10/10</p>
        <button id="restart-btn" class="btn btn-primary">PLAY AGAIN</button>
      </div>
    </div>

    <div class="build-info">
      v2.7 • 2026-09-06
    </div>
  </main>

  <script src="game.js?v=1694011601"></script>
</body>
</html>
