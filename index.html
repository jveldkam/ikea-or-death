<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKEA or Death</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <h1>IKEA or Death</h1>
    <p class="subtitle">Is it an IKEA product or a black-metal band?</p>

    <div id="start-screen" class="screen">
      <p>You'll get a name. Guess whether it belongs to IKEA furniture or a black-metal band.</p>
      <button id="start-btn" class="btn">Start Game</button>
    </div>

    <div id="play-screen" class="screen hidden">
      <div id="question-counter"></div>
      <div id="name-display" class="name-display"></div>
      <div class="choices">
        <button id="ikea-btn" class="btn btn-ikea">IKEA</button>
        <button id="death-btn" class="btn btn-death">Death</button>
      </div>
      <div id="feedback" class="feedback"></div>
    </div>

    <div id="end-screen" class="screen hidden">
      <h2>Game Over</h2>
      <p id="final-score"></p>
      <button id="restart-btn" class="btn">Play Again</button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
