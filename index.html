<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>IKEA or Death</title>
  <link rel="stylesheet" href="styles.css?v=1694011400">
</head>
<body>
  <main class="game">
    <div class="header">
      <h1>IKEA or Death</h1>
      <p class="subtitle">Is it an IKEA product or a black-metal band?</p>
    </div>

    <div id="start-screen" class="screen active">
      <div class="start-content">
        <p class="start-description">You'll get a name. Guess whether it belongs to IKEA furniture or a black-metal band.</p>
        <p class="difficulty-hint">100+ items • Test your knowledge</p>
        <button id="start-btn" class="btn btn-primary">START</button>
      </div>
    </div>

    <div id="play-screen" class="screen">
      <div class="progress-container">
        <div class="score-info">
          <span id="streak-counter" class="streak">SCORE</span>
          <div class="progress-bar">
            <div id="score-bar" class="score-fill"></div>
          </div>
        </div>
        <span id="question-counter" class="question-counter">1/10</span>
      </div>

      <div class="play-content">
        <div id="name-display" class="name-display"></div>
        <div class="divider"></div>
        <div class="choices">
          <button id="ikea-btn" class="btn btn-choice btn-ikea">
            <svg viewBox="0 0 200 200" class="choice-svg">
              <!-- Couch -->
              <rect x="20" y="80" width="160" height="80" fill="none" stroke="currentColor" stroke-width="3"/>
              <!-- Left armrest -->
              <rect x="20" y="60" width="20" height="80" fill="none" stroke="currentColor" stroke-width="3"/>
              <!-- Right armrest -->
              <rect x="160" y="60" width="20" height="80" fill="none" stroke="currentColor" stroke-width="3"/>
              <!-- Cushions -->
              <circle cx="60" cy="100" r="20" fill="none" stroke="currentColor" stroke-width="2"/>
              <circle cx="100" cy="100" r="20" fill="none" stroke="currentColor" stroke-width="2"/>
              <circle cx="140" cy="100" r="20" fill="none" stroke="currentColor" stroke-width="2"/>
              <!-- Legs -->
              <line x1="40" y1="160" x2="40" y2="180" stroke="currentColor" stroke-width="3"/>
              <line x1="160" y1="160" x2="160" y2="180" stroke="currentColor" stroke-width="3"/>
            </svg>
          </button>
          <button id="death-btn" class="btn btn-choice btn-death">
            <svg viewBox="0 0 200 200" class="choice-svg">
              <!-- Skull -->
              <circle cx="100" cy="70" r="40" fill="none" stroke="currentColor" stroke-width="3"/>
              <!-- Jaw -->
              <path d="M 70 100 L 70 120 Q 100 135 130 120 L 130 100" fill="none" stroke="currentColor" stroke-width="3"/>
              <!-- Eye sockets -->
              <circle cx="85" cy="60" r="8" fill="currentColor"/>
              <circle cx="115" cy="60" r="8" fill="currentColor"/>
              <!-- Nose -->
              <path d="M 95 75 L 105 75 L 100 85 Z" fill="currentColor"/>
              <!-- Crossbones behind skull -->
              <line x1="50" y1="100" x2="150" y2="100" stroke="currentColor" stroke-width="2"/>
              <circle cx="50" cy="100" r="6" fill="currentColor"/>
              <circle cx="150" cy="100" r="6" fill="currentColor"/>
              <!-- Horns -->
              <path d="M 75 35 Q 65 20 60 15" stroke="currentColor" stroke-width="2" fill="none"/>
              <path d="M 125 35 Q 135 20 140 15" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
          </button>
        </div>
        <div id="feedback" class="feedback"></div>
      </div>
    </div>

    <div id="end-screen" class="screen">
      <div class="end-content">
        <h2>Game Over</h2>
        <p id="final-score" class="final-score">10/10</p>
        <button id="restart-btn" class="btn btn-primary">PLAY AGAIN</button>
      </div>
    </div>

    <div class="build-info">
      v2.5 • 2026-09-05
    </div>
  </main>

  <script src="game.js?v=1694011400"></script>
</body>
</html>
