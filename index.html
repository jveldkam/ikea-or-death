<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>IKEA or Death</title>
  <link rel="stylesheet" href="styles.css?v=1694007000">
</head>
<body>
  <main class="game">
    <div class="header">
      <h1>⚔️ IKEA or Death ⚔️</h1>
      <p class="subtitle">Is it an IKEA product or a black-metal band?</p>
    </div>

    <div id="start-screen" class="screen active">
      <div class="start-content">
        <p class="start-description">You'll get a name. Guess whether it belongs to IKEA furniture or a black-metal band.</p>
        <p class="difficulty-hint">🎮 40 items × ∞ combinations = endless replayability</p>
        <button id="start-btn" class="btn btn-primary">START GAME</button>
      </div>
    </div>

    <div id="play-screen" class="screen">
      <div class="progress-container">
        <div class="score-info">
          <span id="streak-counter" class="streak">🔥 Streak: 0</span>
          <span id="question-counter" class="question-counter"></span>
        </div>
        <div class="progress-bar">
          <div id="score-bar" class="score-fill"></div>
        </div>
      </div>

      <div class="play-content">
        <div id="name-display" class="name-display"></div>
        <div class="divider"></div>
        <div class="choices">
          <button id="ikea-btn" class="btn btn-ikea">🛋️ IKEA</button>
          <button id="death-btn" class="btn btn-death">🤘 DEATH</button>
        </div>
        <div id="feedback" class="feedback"></div>
      </div>
    </div>

    <div id="end-screen" class="screen">
      <div class="end-content">
        <h2>Game Over</h2>
        <p id="final-score" class="final-score"></p>
        <button id="restart-btn" class="btn btn-primary">PLAY AGAIN</button>
      </div>
    </div>

    <div class="build-info">
      Build: v2.1 | Updated: 2026-09-05 20:11
    </div>
  </main>

  <script src="game.js?v=1694007000"></script>
</body>
</html>
